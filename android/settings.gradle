// No foojay toolchain resolver. It auto-downloads a JDK from the Foojay API
// when Gradle cannot find one matching jvmToolchain(17), which means fetching a
// binary over the network mid-build. F-Droid's scanner rejects that outright,
// and it makes the build depend on a third-party service either way. Provide
// JDK 17 on the machine instead: CI installs it, and the F-Droid recipe does
// the same in its sudo block.
include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
