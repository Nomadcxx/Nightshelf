<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
  <title id="title">Nightshelf cover placeholder</title>
  <desc id="desc">A dark cover with the Nightshelf mint book and audio waves mark.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1B1E30"/>
      <stop offset="1" stop-color="#12141F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="640" fill="url(#ground)"/>
  <!-- Spine rule, echoing the shelf language without competing with real art. -->
  <rect x="0" y="0" width="6" height="640" fill="#7CFFB2" opacity="0.5"/>
  <!--
    The mark is held at 0.30 opacity on purpose: a placeholder sits beside real
    covers hundreds at a time, and at full strength a wall of them reads louder
    than the artwork it stands in for.
  -->
  <g transform="translate(200,286) scale(0.52) translate(-256,-289)" opacity="0.30">
    <g fill="none" stroke="#7CFFB2" stroke-linecap="round">
      <path d="M164 158 C218 124 294 124 348 158" stroke-width="24"/>
      <path d="M191 202 C230 178 282 178 321 202" stroke-width="22"/>
      <path d="M221 239 C242 226 270 226 291 239" stroke-width="20"/>
    </g>
    <g fill="#7CFFB2">
      <path d="M248 286 C224 263 191 249 151 244 C141 243 133 251 133 261 V367 C133 379 143 388 155 388 C194 388 225 397 248 416 Z"/>
      <path d="M264 286 C288 263 321 249 361 244 C371 243 379 251 379 261 V367 C379 379 369 388 357 388 C318 388 287 397 264 416 Z"/>
      <path d="M112 277 C112 268 119 261 128 261 C137 261 144 268 144 277 V382 C144 394 154 404 166 404 C202 404 232 412 256 431 V455 C226 432 191 421 151 421 H140 C124 421 112 409 112 393 Z"/>
      <path d="M400 277 C400 268 393 261 384 261 C375 261 368 268 368 277 V382 C368 394 358 404 346 404 C310 404 280 412 256 431 V455 C286 432 321 421 361 421 H372 C388 421 400 409 400 393 Z"/>
    </g>
    <path d="M256 285 V423" fill="none" stroke="#12141F" stroke-width="16" stroke-linecap="round"/>
  </g>
  <path d="M120 470h160" stroke="#7CFFB2" stroke-width="2" opacity="0.22"/>
  <text x="200" y="502" fill="#7CFFB2" fill-opacity="0.45" font-family="ui-monospace, monospace" font-size="15" letter-spacing="4" text-anchor="middle">NIGHTSHELF</text>
</svg>
