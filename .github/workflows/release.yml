name: Release

# Tag a version and this attaches an installable APK to the GitHub Release, so
# the README can point people at Releases instead of asking them to build.
#
#   git tag v0.13.0-beta && git push --tags
#
# Signing runs off four repository secrets:
#
#   NIGHTSHELF_KEYSTORE_BASE64   base64 of the .keystore file
#   NIGHTSHELF_STORE_PASSWORD
#   NIGHTSHELF_KEY_ALIAS
#   NIGHTSHELF_KEY_PASSWORD
#
# The debug fallback below exists only so a fork with no keystore of its own
# still produces something installable. Never publish from that path here: an
# APK signed with a different key cannot upgrade one signed with this key, so
# anyone who installed a debug-signed release has to uninstall to move off it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Generate web layer
        run: ./node_modules/.bin/nuxt generate
      - name: Sync to Android
        run: npx cap sync android

      - name: Decode keystore if one is configured
        id: keystore
        env:
          KS: ${{ secrets.NIGHTSHELF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No keystore secret set. Publishing a debug-signed APK."
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          # Absolute. Gradle resolves a relative `file()` against the app module
          # directory, not the workspace, so a relative path lands in the wrong
          # place and the build fails looking for a keystore that is right there.
          NIGHTSHELF_KEYSTORE: ${{ github.workspace }}/android/app/release.keystore
          NIGHTSHELF_STORE_PASSWORD: ${{ secrets.NIGHTSHELF_STORE_PASSWORD }}
          NIGHTSHELF_KEY_ALIAS: ${{ secrets.NIGHTSHELF_KEY_ALIAS }}
          NIGHTSHELF_KEY_PASSWORD: ${{ secrets.NIGHTSHELF_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: steps.keystore.outputs.signed == 'false'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -print0 \
            | xargs -0 -I{} cp -v {} "out/nightshelf-${GITHUB_REF_NAME}.apk"
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f android/app/release.keystore

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          generate_release_notes: true
