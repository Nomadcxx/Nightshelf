name: Release

# Tag a version and this attaches an installable APK to the GitHub Release, so
# the README can point people at Releases instead of asking them to build.
#
#   git tag v0.13.0-beta && git push --tags
#
# Signing runs off four repository secrets:
#
#   NIGHTSHELF_KEYSTORE_BASE64   base64 of the .keystore file
#   NIGHTSHELF_STORE_PASSWORD
#   NIGHTSHELF_KEY_ALIAS
#   NIGHTSHELF_KEY_PASSWORD
#
# The debug fallback below exists only so a fork with no keystore of its own
# still produces something installable. Never publish from that path here: an
# APK signed with a different key cannot upgrade one signed with this key, so
# anyone who installed a debug-signed release has to uninstall to move off it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to the version Debian trixie ships, which is what F-Droid's
          # buildserver installs. The APK released here has to match the one
          # they build from source, so the toolchain that produces it should
          # not drift with whatever the runner happens to have.
          node-version: 20.19.2
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - name: Unit tests
        run: node --test tests/*.test.js

      # F-Droid reads fastlane/ and the version from the tag it builds, and it
      # picks up new tags on its own once the app is listed. A tag missing a
      # changelog therefore produces a live listing with an empty release note,
      # and a package.json out of step with build.gradle makes the app report a
      # version it is not. Both are only fixable by tagging again, so they are
      # caught here rather than after publishing.
      - name: Release metadata preflight
        run: python3 scripts/fdroid-metadata.py --check
      - name: Generate web layer
        run: ./node_modules/.bin/nuxt generate
      - name: Sync to Android
        run: npx cap sync android

      - name: Decode keystore if one is configured
        id: keystore
        env:
          KS: ${{ secrets.NIGHTSHELF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No keystore secret set. Publishing a debug-signed APK."
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          # Absolute. Gradle resolves a relative `file()` against the app module
          # directory, not the workspace, so a relative path lands in the wrong
          # place and the build fails looking for a keystore that is right there.
          NIGHTSHELF_KEYSTORE: ${{ github.workspace }}/android/app/release.keystore
          NIGHTSHELF_STORE_PASSWORD: ${{ secrets.NIGHTSHELF_STORE_PASSWORD }}
          NIGHTSHELF_KEY_ALIAS: ${{ secrets.NIGHTSHELF_KEY_ALIAS }}
          NIGHTSHELF_KEY_PASSWORD: ${{ secrets.NIGHTSHELF_KEY_PASSWORD }}
        # Play takes an App Bundle; the APK is for sideloading from Releases.
        # Both come from the same signed build so they cannot diverge.
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Build debug APK
        if: steps.keystore.outputs.signed == 'false'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the artifacts
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -print0 \
            | xargs -0 -I{} cp -v {} "out/nightshelf-${GITHUB_REF_NAME}.apk"
          # Checksums cover the APK alone, because that is all the release
          # publishes. Listing the bundle here made `sha256sum -c` fail for
          # anyone verifying a download, against a file they could not fetch.
          sha256sum out/nightshelf-*.apk > out/SHA256SUMS.txt
          # The bundle only exists on the signed path; a debug fallback has none.
          find android/app/build/outputs/bundle -name '*.aab' -print0 2>/dev/null \
            | xargs -0 -r -I{} cp -v {} "out/nightshelf-${GITHUB_REF_NAME}.aab"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f android/app/release.keystore

      # The bundle is uploaded to Play, not attached to the public release: it
      # is not installable and publishing it invites confusion.
      - name: Keep the bundle as a workflow artifact
        if: steps.keystore.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightshelf-aab
          path: out/*.aab
          retention-days: 90

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          generate_release_notes: true
